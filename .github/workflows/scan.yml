name: MSNR Bot Scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: msnr-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: python -u bot.py

      - name: Save state
        run: |
          git config user.name "MSNR Bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --staged --quiet || git commit -m "Update state [auto]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      - name: Trigger next run (self-loop)
        if: success()
        run: |
          echo "⏰ Waiting 3 minutes before next run..."
          sleep 180
          echo "🚀 Dispatching next workflow..."
          curl -s -w "\nHTTP_CODE=%{http_code}\n" -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✅ Dispatch command sent"